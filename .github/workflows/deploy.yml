name: Continuous Deployment
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: express-backend
          file: express-backend/Dockerfile
          push: true
          tags: aniketjha4518/medcare-backend:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Stop old containers
        run: |
          docker stop medcare-backend || true
          docker rm medcare-backend || true

      - name: Clean up disk space
        run: |
          docker system prune -af --volumes
          sudo apt clean 2>/dev/null || true

      - name: Pull image from docker hub
        run: docker pull aniketjha4518/medcare-backend:latest

      - name: Run docker container
        run: |
          docker run -d \
            -p 4000:4000 \
            --name medcare-backend \
            --restart unless-stopped \
            -e NODE_ENV="production" \
            -e PORT="4000" \
            -e HOST="0.0.0.0" \
            -e API_PREFIX="/api" \
            -e RUN_SEED="false" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e REDIS_URL="${{ secrets.REDIS_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e JWT_EXPIRES_IN="7d" \
            -e CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
            -e CORS_CREDENTIALS="true" \
            aniketjha4518/medcare-backend:latest

      - name: Remove old images
        run: docker image prune -af
