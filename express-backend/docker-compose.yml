services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cognizant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cognizant_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cognizant}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognizant} -d ${POSTGRES_DB:-cognizant}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-cognizant_redis}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-cognizant_redis} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      API_PREFIX: /api
      DATABASE_URL: postgresql://${POSTGRES_USER:-cognizant}:${POSTGRES_PASSWORD:-cognizant_secret}@postgres:5432/${POSTGRES_DB:-cognizant}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cognizant_redis}@redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CORS_CREDENTIALS: "true"
      # Required by the env schema, so the stack will not boot without it. The default
      # is a local-only placeholder - override it anywhere that is not your laptop.
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32ch}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Alert detection runs on this cadence as well as at the end of a planning run
      # and on POST /api/alerts/refresh. 0 disables the scheduler.
      ALERT_DETECTION_INTERVAL_MS: ${ALERT_DETECTION_INTERVAL_MS:-300000}
      NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-high}
      NOTIFY_TIMEOUT_MS: ${NOTIFY_TIMEOUT_MS:-10000}
      # Unset by default. An unconfigured channel records SKIPPED with a reason rather
      # than failing detection, so the stack runs fine with no mail or AWS account.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ALERT_EMAIL_RECIPIENTS: ${ALERT_EMAIL_RECIPIENTS:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SNS_TOPIC_ARN: ${AWS_SNS_TOPIC_ARN:-}
      AWS_SNS_SENDER_ID: ${AWS_SNS_SENDER_ID:-}
      ALERT_SMS_RECIPIENTS: ${ALERT_SMS_RECIPIENTS:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      # Gates /api/training-data, which the forecasting engine reads.
      TRAINING_API_KEY: ${TRAINING_API_KEY:-local-compose-service-key}
      PLANNING_EXECUTOR: ${PLANNING_EXECUTOR:-inline}
      PLANNING_SIMULATION_ITERATIONS: ${PLANNING_SIMULATION_ITERATIONS:-500}
      PLANNING_RETENTION_RUNS: ${PLANNING_RETENTION_RUNS:-20}
      # Empty until the Python forecasting service exists; the naive fallback covers it.
      FORECAST_SERVICE_URL: ${FORECAST_SERVICE_URL:-}
      FORECAST_TIMEOUT_MS: ${FORECAST_TIMEOUT_MS:-60000}
      FORECAST_RETRIES: ${FORECAST_RETRIES:-2}
      FORECAST_FALLBACK: ${FORECAST_FALLBACK:-true}
      FORECAST_TRAIN_TIMEOUT_MS: ${FORECAST_TRAIN_TIMEOUT_MS:-600000}
      # Seeds only when the Product table is empty. The check fails closed:
      # if the count cannot be read, the seed is skipped rather than risked,
      # because seeding truncates every table first.
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
